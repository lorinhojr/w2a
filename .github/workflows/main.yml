# ============================================================================
# W2A Builder (painel web2app) — APK/AAB a partir de links do zip e do ícone.
#
# Segurança (corrigido):
# - Nenhum valor do payload entra direto em comandos (antes dava para injetar
#   comandos pelo nome do app).
# - Senhas de keystore NÃO podem vir em claro: o painel manda "keystore_sealed"
#   cifrado com a chave pública do builder (antes apareciam no log público).
# - A release pública leva só APK/AAB; nunca chaves.
#
# Segredos opcionais (chave fixa para o modo automático, permite atualizar apps):
#   W2A_REPO_KEYSTORE (base64), W2A_REPO_STOREPASS, W2A_REPO_ALIAS, W2A_REPO_KEYPASS
#   ZE_SEAL_KEY (para abrir keystores cifradas enviadas pelo painel)
# ============================================================================
name: W2A Builder

on:
  repository_dispatch:
    types: [build_event]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar id
        env:
          APP_ID: ${{ github.event.client_payload.app_id }}
        run: |
          [[ "$APP_ID" =~ ^app_[A-Za-z0-9.]{1,40}$ ]] || { echo "::error::app_id inválido"; exit 1; }
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Preparar projeto
        id: prep
        env:
          W2A_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          ZE_SEAL_KEY: ${{ secrets.ZE_SEAL_KEY }}
          W2A_REPO_KEYSTORE: ${{ secrets.W2A_REPO_KEYSTORE }}
          W2A_REPO_STOREPASS: ${{ secrets.W2A_REPO_STOREPASS }}
          W2A_REPO_ALIAS: ${{ secrets.W2A_REPO_ALIAS }}
          W2A_REPO_KEYPASS: ${{ secrets.W2A_REPO_KEYPASS }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow pynacl
          python3 .github/zengine/legacy_payload.py "$RUNNER_TEMP/job"
          python3 .github/zengine/prepare_android.py "$RUNNER_TEMP/job"

      - name: Compilar APK e AAB
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.prep.outputs.tasks }} --no-daemon --stacktrace

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ env.APP_ID }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 3

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_ID }}
          tag_name: build-${{ github.run_id }}-${{ env.APP_ID }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          body: |
            Build ${{ env.APP_ID }} gerado pelo W2A Builder.

      - name: Limpar segredos
        if: always()
        run: rm -f "$RUNNER_TEMP"/w2a-* "$RUNNER_TEMP"/chave-android.zip
